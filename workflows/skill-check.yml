name: skill-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vendor-check:
    if: hashFiles('skills.lock.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify vendored skills match the lockfile digests
        run: python3 scripts/skill_vendor.py check --offline
      - name: Verify lockfile pins still match upstream
        run: python3 scripts/skill_vendor.py check
